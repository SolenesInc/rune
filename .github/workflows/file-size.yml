name: file size

# The Rust file-size and folder-shape check (scripts/file-size.sh), on each push to main and on
# request: a few seconds on Linux.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/file-size.sh
