[package]
name = "browser-tiles"
version = "0.0.1"
edition = "2024"
publish = false
default-run = "browser-tiles"

[features]
default = ["cef"]
cef = ["dep:cef"]

[[bin]]
name = "browser-tiles"
path = "src/main.rs"

[[bin]]
name = "browser-tiles-helper"
path = "src/bin/helper.rs"
required-features = ["cef"]

[dependencies]
rune = { path = "../../crates/rune" }
serde_json = "1"
cef = { version = "=156.4.0", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-web-kit = "0.3.2"
objc2-metal = { version = "0.3.2", features = ["objc2-io-surface"] }
objc2-io-surface = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-foundation = "0.3.2"
block2 = "0.6.2"
raw-window-handle = "0.6.2"
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"

[profile.release]
debug = 1

[workspace]

[patch.crates-io]
wgpu-hal = { path = "../../vendor/wgpu-hal" }
winit = { path = "../../vendor/winit" }
parley_engine = { path = "../../vendor/parley_engine" }
accesskit_windows = { path = "../../vendor/accesskit_windows" }
